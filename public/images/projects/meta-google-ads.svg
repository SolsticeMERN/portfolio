  <line x1="44" y1="290" x2="556" y2="290" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Area under curve -->
  <path d="M 50 310 Q 130 290 200 240 T 360 210 T 500 190 L 540 195 L 540 320 L 50 320 Z" fill="url(#chartGrad)"/>
