<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="opsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151921"/>
      <stop offset="100%" stop-color="#0E1217"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="12" fill="url(#opsBg)"/>
  <rect x="0.5" y="0.5" width="599" height="379" rx="11.5" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <!-- App Header -->
  <rect x="24" y="24" width="552" height="42" rx="8" fill="#1C212A" stroke="rgba(255,255,255,0.06)"/>
  <circle cx="44" cy="45" r="4" fill="#EF4444" opacity="0.8"/>
  <circle cx="58" cy="45" r="4" fill="#F59E0B" opacity="0.8"/>
  <circle cx="72" cy="45" r="4" fill="#10B981" opacity="0.8"/>
  <text x="100" y="49" fill="#A8B0BC" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Cross-Border Client Coordination &amp; Project Fulfillment</text>
  <rect x="455" y="33" width="105" height="24" rx="12" fill="#10B981" opacity="0.2"/>
  <text x="507" y="49" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">UPWORK / FIVERR</text>

  <!-- Metric 1 -->
  <rect x="24" y="80" width="168" height="80" rx="8" fill="#1E242F" stroke="rgba(255,255,255,0.05)"/>
  <text x="40" y="104" fill="#8E97A6" font-family="system-ui, sans-serif" font-size="11">Client Communication</text>
  <text x="40" y="132" fill="#F5F6F8" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Async &amp; Direct</text>
  <text x="40" y="148" fill="#3478F6" font-family="system-ui, sans-serif" font-size="10" font-weight="600">English Fluency</text>

  <!-- Metric 2 -->
  <rect x="206" y="80" width="188" height="80" rx="8" fill="#1E242F" stroke="rgba(255,255,255,0.05)"/>
  <text x="222" y="104" fill="#8E97A6" font-family="system-ui, sans-serif" font-size="11">Execution Speed</text>
  <text x="222" y="132" fill="#F5F6F8" font-family="system-ui, sans-serif" font-size="20" font-weight="700">On-Time Delivery</text>
  <text x="222" y="148" fill="#10B981" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Strict Quality Milestones</text>

  <!-- Metric 3 -->
  <rect x="408" y="80" width="168" height="80" rx="8" fill="#1E242F" stroke="rgba(255,255,255,0.05)"/>
  <text x="424" y="104" fill="#8E97A6" font-family="system-ui, sans-serif" font-size="11">Scope Governance</text>
  <text x="424" y="132" fill="#F5F6F8" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Structured</text>
  <text x="424" y="148" fill="#3478F6" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Requirements Clarification</text>

  <!-- Project Milestone Board -->
  <rect x="24" y="174" width="552" height="182" rx="8" fill="#181D25" stroke="rgba(255,255,255,0.05)"/>

  <!-- Milestone 1 -->
  <rect x="44" y="196" width="154" height="136" rx="6" fill="#202632" stroke="rgba(255,255,255,0.04)"/>
  <text x="56" y="220" fill="#3478F6" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Phase 01: Scoping</text>
  <text x="56" y="244" fill="#E5E7EB" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Brief Extraction</text>
  <text x="56" y="264" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">Clarifying criteria, target</text>
  <text x="56" y="280" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">market, and deliverable</text>
  <text x="56" y="296" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">specifications.</text>

  <!-- Milestone 2 -->
  <rect x="214" y="196" width="164" height="136" rx="6" fill="#202632" stroke="rgba(255,255,255,0.04)"/>
  <text x="226" y="220" fill="#3478F6" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Phase 02: Research</text>
  <text x="226" y="244" fill="#E5E7EB" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Data Collation</text>
  <text x="226" y="264" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">Systematic online search,</text>
  <text x="226" y="280" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">deduplication, and quality</text>
  <text x="226" y="296" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">benchmarking.</text>

  <!-- Milestone 3 -->
  <rect x="394" y="196" width="164" height="136" rx="6" fill="#202632" stroke="rgba(52,120,246,0.3)"/>
  <text x="406" y="220" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Phase 03: Delivery</text>
  <text x="406" y="244" fill="#E5E7EB" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Final Verification</text>
  <text x="406" y="264" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">Delivery in client format,</text>
  <text x="406" y="280" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">post-delivery follow-up,</text>
  <text x="406" y="296" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">and revision support.</text>
</svg>
