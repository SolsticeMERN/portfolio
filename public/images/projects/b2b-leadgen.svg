<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151920"/>
      <stop offset="100%" stop-color="#0E1116"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3478F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232934"/>
      <stop offset="100%" stop-color="#1A1E26"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="12" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="599" height="379" rx="11.5" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <!-- Top App Header -->
  <rect x="24" y="24" width="552" height="42" rx="8" fill="#1C212A" stroke="rgba(255,255,255,0.06)"/>
  <circle cx="44" cy="45" r="4" fill="#EF4444" opacity="0.8"/>
  <circle cx="58" cy="45" r="4" fill="#F59E0B" opacity="0.8"/>
  <circle cx="72" cy="45" r="4" fill="#10B981" opacity="0.8"/>
  
  <text x="100" y="49" fill="#A8B0BC" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Pipeline Intelligence &amp; B2B Prospect Verification</text>
  <rect x="470" y="33" width="90" height="24" rx="12" fill="#3478F6" opacity="0.2"/>
  <text x="515" y="49" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">VERIFIED</text>

  <!-- Metric 1 Card -->
  <rect x="24" y="82" width="168" height="84" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.05)"/>
  <text x="40" y="106" fill="#8E97A6" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Target Contacts</text>
  <text x="40" y="136" fill="#F5F6F8" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Multi-Industry</text>
  <text x="40" y="154" fill="#3478F6" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Enterprise &amp; Mid-Market</text>

  <!-- Metric 2 Card -->
  <rect x="206" y="82" width="188" height="84" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.05)"/>
  <text x="222" y="106" fill="#8E97A6" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Verification Protocol</text>
  <text x="222" y="136" fill="#F5F6F8" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Triple Checked</text>
  <text x="222" y="154" fill="#10B981" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Domain, SMTP &amp; LinkedIn</text>

  <!-- Metric 3 Card -->
  <rect x="408" y="82" width="168" height="84" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.05)"/>
  <text x="424" y="106" fill="#8E97A6" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Data Hygiene</text>
  <text x="424" y="136" fill="#F5F6F8" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Zero Duplicates</text>
  <text x="424" y="154" fill="#3478F6" font-family="system-ui, sans-serif" font-size="10" font-weight="600">CRM Field Enrichment</text>

  <!-- Data Table Mockup -->
  <rect x="24" y="182" width="552" height="174" rx="8" fill="#181D25" stroke="rgba(255,255,255,0.05)"/>
  
  <!-- Row 1 -->
  <rect x="40" y="202" width="130" height="18" rx="4" fill="#262D39"/>
  <rect x="186" y="202" width="110" height="18" rx="4" fill="#202732"/>
  <rect x="312" y="202" width="120" height="18" rx="4" fill="#202732"/>
  <rect x="448" y="202" width="70" height="18" rx="9" fill="#10B981" opacity="0.2"/>
  <text x="483" y="215" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Valid Email</text>

  <!-- Row 2 -->
  <rect x="40" y="234" width="145" height="18" rx="4" fill="#262D39"/>
  <rect x="201" y="234" width="95" height="18" rx="4" fill="#202732"/>
  <rect x="312" y="234" width="120" height="18" rx="4" fill="#202732"/>
  <rect x="448" y="234" width="70" height="18" rx="9" fill="#10B981" opacity="0.2"/>
  <text x="483" y="247" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Valid Email</text>

  <!-- Row 3 -->
  <rect x="40" y="266" width="120" height="18" rx="4" fill="#262D39"/>
  <rect x="176" y="266" width="120" height="18" rx="4" fill="#202732"/>
  <rect x="312" y="266" width="120" height="18" rx="4" fill="#202732"/>
  <rect x="448" y="266" width="70" height="18" rx="9" fill="#10B981" opacity="0.2"/>
  <text x="483" y="279" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Valid Email</text>

  <!-- Bottom workflow progress -->
  <line x1="40" y1="312" x2="560" y2="312" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="50" cy="332" r="6" fill="#3478F6"/>
  <line x1="56" y1="332" x2="160" y2="332" stroke="#3478F6" stroke-width="2"/>
  <circle cx="166" cy="332" r="6" fill="#3478F6"/>
  <line x1="172" y1="332" x2="280" y2="332" stroke="#3478F6" stroke-width="2"/>
  <circle cx="286" cy="332" r="6" fill="#3478F6"/>
  <text x="310" y="336" fill="#A8B0BC" font-family="system-ui, sans-serif" font-size="11">Prospecting → Enrichment → Multi-Step Verification → Client Delivery</text>
</svg>
